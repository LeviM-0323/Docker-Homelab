services:
  nginx:
    image: lscr.io/linuxserver/nginx:latest
    container_name: nginx
    mem_limit: 128M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - VIRTUAL_HOST=levimclean.world
      - LETSENCRYPT_HOST=levimclean.world
      - LETSENCRYPT_EMAIL=levi@levimclean.world
    volumes:
      - ${CONFIG}/nginx-config:/config
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - db_network

  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx-proxy
    mem_limit: 128M
    environment:
      - DEFAULT_HOST=levimclean.world
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_proxy_certs:/etc/nginx/certs
      - nginx_proxy_vhost:/etc/nginx/vhost.d
      - nginx_proxy_html:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - db_network
      - proxy

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    mem_limit: 128M
    depends_on:
      - nginx-proxy
    environment:
      - DEFAULT_EMAIL=levi@levimclean.world
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_proxy_certs:/etc/nginx/certs
      - nginx_proxy_vhost:/etc/nginx/vhost.d
      - nginx_proxy_html:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - db_network
      - proxy

  mysql:
    image: mysql
    container_name: mysql
    mem_limit: 512M
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=123
    volumes:
      - ${CONFIG}/mysql-config:/var/lib/mysql
    networks:
      - db_network

  # mariadb:
  #   image: mariadb
  #   container_name: mariadb
  #   mem_limit: 512M
  #   ports:
  #     - "3307:3306"
  #   user: "1000:1000"
  #   restart: unless-stopped
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=123
  #   volumes:
  #     - ${CONFIG}/mariadb-config:/var/lib/mysql
  #   networks:
  #     - db_network

  adminer:
    image: adminer
    container_name: adminer
    mem_limit: 128M
    ports:
      - "8889:8080"
    restart: unless-stopped
    networks:
      - db_network

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=${TZ}
      - GITEA__server__ROOT_URL=https://git.levimclean.world/
      - VIRTUAL_HOST=git.levimclean.world
      - VIRTUAL_PORT=3000
      - CLIENT_MAX_BODY_SIZE=0
      - LETSENCRYPT_HOST=git.levimclean.world
      - LETSENCRYPT_EMAIL=levi@levimclean.world
    mem_limit: 1G
    restart: unless-stopped
    volumes:
      - ${CONFIG}/gitea-config:/data
    expose:
      - "3000"
    networks:
      - db_network
      - proxy

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    mem_limit: 256M
    environment:
      PUID: 1000
      PGID: 986
      HOMEPAGE_ALLOWED_HOSTS: "*"
      TZ: ${TZ}
    ports:
      - 3000:3000
    volumes:
      - ${CONFIG}/homepage-config:/app/config
      - ${CONFIG}/homepage-config/images:/app/public/images # optional, for images
      - /var/run/docker.sock:/var/run/docker.sock # optional, for docker stats widget
    restart: unless-stopped

  diskwake:
    container_name: diskWake
    build: ${CONFIG}/diskwake-config
    mem_limit: 64M
    environment:
      - TZ=${TZ}
    volumes:
      - "${MEDIA}:/mnt/externalhdd"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    mem_limit: 128M
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}

  cloudflared-ddns:
    image: oznu/cloudflare-ddns:latest
    container_name: cloudflared-ddns
    mem_limit: 128M
    restart: unless-stopped
    environment:
      - API_KEY=${CLOUDFLARE_TOKEN2}
      - ZONE=levimclean.world
      - TZ=${TZ}

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    mem_limit: 256M
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERPORT=51820
      - PEERS=5
      - ALLOWEDIPS=0.0.0.0/0
      - LOG_CONFS=true
    volumes:
      - ${CONFIG}/wireguard-config:/config
      - /lib/modules:/lib/modules
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    mem_limit: 128M
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_NOTIFICATION_URL=discord://8aK38AwQ_uUjWzm4DHzSxDOfZe6zBSZ571PCvNNEl1KK8tcd8miF70h8y6NtpVdGsZYm@1323419622921338891
      - WATCHTOWER_HTTP_API_METRICS=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - DOCKER_API_VERSION=1.52
    restart: unless-stopped
    command: --schedule "0 0 4 * * *"

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.levimclean.world"
      SIGNUPS_ALLOWED: "true"
      ADMIN_TOKEN: ${VAULT_TOKEN}
      VIRTUAL_HOST: vault.levimclean.world
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: vault.levimclean.world
      LETSENCRYPT_EMAIL: levi@levimclean.world
    volumes:
      - ${CONFIG}/vaultwarden-config:/data
    networks:
      - proxy

networks:
  proxy:
  db_network:
    driver: bridge

volumes:
  nginx_proxy_certs:
  nginx_proxy_vhost:
  nginx_proxy_html:
