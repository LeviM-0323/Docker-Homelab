#-------------------------- MEDIA CONTAINERS -------------------- #
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - VERSION=docker
    volumes:
      - ${CONFIG}/plex-config:/config
      - ${TV}:/tv
      - ${MOVIES}:/movies
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    mem_limit: 512M
    # network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/sonarr-config:/config
      - ${MEDIA}:/media
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    mem_limit: 256M
    # network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/radarr-config:/config
      - ${MEDIA}:/media
    ports:
      - "7878:7878"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    mem_limit: 256M
    environment:
      - PUID=13006
      - PGID=13000
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/prowlarr-config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    # network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${MEDIA}:/media
      - ${CONFIG}/sabnzbd-config:/config
      - /home/levi/Downloads:/watched
    ports:
      - "8081:8081"
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    mem_limit: 256M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/tautulli-config:/config
    ports:
      - 8181:8181
    restart: unless-stopped

  doplarr:
    image: lscr.io/linuxserver/doplarr:3.8.0
    container_name: doplarr
    mem_limit: 512M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - DISCORD__TOKEN=${DOPLARR_TOKEN}
      - RADARR__API=${RADARR_TOKEN}
      - RADARR__URL=http://192.168.2.254:7878
      - SONARR__API=${SONARR_TOKEN}
      - SONARR__URL=http://192.168.2.254:8989
      - DISCORD__MAX_RESULTS=10 #optional
      - DISCORD__REQUESTED_MSG_STYLE=:embed #optional
      - PARTIAL_SEASONS=false #optional
      - LOG_LEVEL=:info #optional
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - ${CONFIG}/seerr-config:/app/config
    restart: unless-stopped

  #----------------------- DEVELOPMENT CONTAINERS -----------------#
  nginx:
    image: lscr.io/linuxserver/nginx:latest
    container_name: nginx
    mem_limit: 128M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/nginx-config:/config
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - db_network

  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx-proxy
    mem_limit: 512M
    environment:
      - DEFAULT_HOST=levimclean.world
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ${CONFIG}/nginx-proxy/certs:/etc/nginx/certs
      - ${CONFIG}/nginx-proxy/vhost:/etc/nginx/vhost.d
      - ${CONFIG}/nginx-proxy/html:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - db_network
      - proxy

  portfolio:
    build:
      context: ./config/portfolio-config
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${PORTFOLIO_DATABASE_URL:-}
      VIRTUAL_HOST: "levimclean.world"
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: "levimclean.world"
      LETSENCRYPT_EMAIL: "levi@levimclean.world"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(async (response) => { const body = await response.json(); process.exit(response.ok && body.status === 'ok' ? 0 : 1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      nginx-proxy:
        condition: service_started
    networks:
      - proxy
      - db_network

  portfolio-e2e:
    profiles:
      - portfolio-test
    build:
      context: ./config/portfolio-config
      target: test-runner
    environment:
      DATABASE_URL: mysql://portfolio_test:portfolio-test-only@portfolio-test-db:3306/portfolio_test
      NEXT_TELEMETRY_DISABLED: "1"
      SMTP_HOST: portfolio-mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
    expose:
      - "3000"
    volumes:
      - ./config/portfolio-config/tests:/app/tests:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(async (response) => { const body = await response.json(); process.exit(response.ok && body.status === 'ok' ? 0 : 1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      portfolio-test-db:
        condition: service_healthy
      portfolio-mailpit:
        condition: service_started
    networks:
      - portfolio_test
    restart: "no"

  portfolio-test-db:
    profiles:
      - portfolio-test
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio_test
      MYSQL_USER: portfolio_test
      MYSQL_PASSWORD: portfolio-test-only
      MYSQL_ROOT_PASSWORD: portfolio-test-root-only
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP --host=127.0.0.1 --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --execute='SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - portfolio_test
    restart: "no"

  portfolio-mailpit:
    profiles:
      - portfolio-test
    image: axllent/mailpit:v1.27.8
    expose:
      - "1025"
      - "8025"
    networks:
      - portfolio_test
    restart: "no"

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    mem_limit: 128M
    depends_on:
      - nginx-proxy
    environment:
      - DEFAULT_EMAIL=aidanmclean111@gmail.com
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG}/nginx-proxy/certs:/etc/nginx/certs
      - ${CONFIG}/nginx-proxy/vhost:/etc/nginx/vhost.d
      - ${CONFIG}/nginx-proxy/html:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - db_network
      - proxy

  mysql:
    image: mysql
    container_name: mysql
    mem_limit: 512M
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=123
    volumes:
      - ${CONFIG}/mysql-config:/var/lib/mysql
    networks:
      - db_network

  mariadb:
    image: mariadb
    container_name: mariadb
    mem_limit: 512M
    ports:
      - "3307:3306"
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=123
    volumes:
      - ${CONFIG}/mariadb-config:/var/lib/mysql
    networks:
      - db_network

  adminer:
    image: adminer
    container_name: adminer
    mem_limit: 128M
    ports:
      - "8889:8080"
    restart: unless-stopped
    networks:
      - db_network

  levibot:
    container_name: levibot
    build: ${CONFIG}/discord-bot
    mem_limit: 256M
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false

  muse:
    image: ghcr.io/museofficial/muse:latest # pr-1256
    container_name: music_bot
    mem_limit: 256M
    restart: unless-stopped
    volumes:
      - ${CONFIG}/muse-config:/data
    environment:
      - DISCORD_TOKEN=${MUSE_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_SECRET}

  pairdrop:
    container_name: pairdrop
    restart: unless-stopped
    image: lscr.io/linuxserver/pairdrop:latest
    mem_limit: 256M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - RATE_LIMIT=false
    ports:
      - 6969:3000

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=${TZ}
      - GITEA__server__ROOT_URL=https://git.levimclean.world/
      - VIRTUAL_HOST=git.levimclean.world
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=git.levimclean.world
      - LETSENCRYPT_EMAIL=levi@levimclean.world
      - CLIENT_MAX_BODY_SIZE=0
    mem_limit: 1G
    restart: unless-stopped
    volumes:
      - ${CONFIG}/gitea-config:/data
    expose:
      - "3000"
    networks:
      - db_network
      - proxy

  #----------------- INFRASTRUCTURE CONTAINERS --------------------#
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    mem_limit: 256M
    environment:
      PUID: 1000
      PGID: 986
      HOMEPAGE_ALLOWED_HOSTS: "*"
      TZ: ${TZ}
    ports:
      - 3000:3000
    volumes:
      - ${CONFIG}/homepage-config:/app/config
      - ${CONFIG}/homepage-config/images:/app/public/images # optional, for images
      - /var/run/docker.sock:/var/run/docker.sock # optional, for docker stats widget
    restart: unless-stopped

  diskwake:
    container_name: diskWake
    build: ${CONFIG}/diskwake-config
    mem_limit: 64M
    environment:
      - TZ=${TZ}
    volumes:
      - "${MEDIA}:/mnt/externalhdd"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    uts: host
    mem_limit: 128M
    environment:
      - TZ=${TZ}
      - "GLANCES_OPT=-w"
    ports:
      - "61208:61208"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/os-release:/etc/os-release:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    mem_limit: 128M
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
  
  cloudflared-ddns:
    image: oznu/cloudflare-ddns:latest
    container_name: cloudflared-ddns
    mem_limit: 128M
    restart: unless-stopped
    environment:
      - API_KEY=${CLOUDFLARE_TOKEN2}
      - ZONE=levimclean.world
      - TZ=${TZ}

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    mem_limit: 256M
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERPORT=51820
      - PEERS=5
      - ALLOWEDIPS=0.0.0.0/0
      - LOG_CONFS=true
    volumes:
      - ${CONFIG}/wireguard-config:/config
      - /lib/modules:/lib/modules
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    mem_limit: 128M
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_NOTIFICATION_URL=discord://8aK38AwQ_uUjWzm4DHzSxDOfZe6zBSZ571PCvNNEl1KK8tcd8miF70h8y6NtpVdGsZYm@1323419622921338891
      - WATCHTOWER_HTTP_API_METRICS=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - DOCKER_API_VERSION=1.52
    restart: unless-stopped
    command: --schedule "0 0 4 * * *"

  #--------------------- MONITORING CONTAINERS ---------------------#
  dozzle:
    image: amir20/dozzle:latest
    mem_limit: 128M
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080
    environment:
      # Uncomment to enable container actions (stop, start, restart). See https://dozzle.dev/guide/actions
      - DOZZLE_ENABLE_ACTIONS=true
      # Uncomment to allow access to container shells. See https://dozzle.dev/guide/shell
      - DOZZLE_ENABLE_SHELL=true
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2
    mem_limit: 256M
    restart: unless-stopped
    container_name: uptime-kuma
    volumes:
      - ${CONFIG}/uptimeKuma-config:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3001:3001"
  
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.levimclean.world"
      SIGNUPS_ALLOWED: "true"
      ADMIN_TOKEN: ${VAULT_TOKEN}
      VIRTUAL_HOST: vault.levimclean.world
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: vault.levimclean.world
      LETSENCRYPT_EMAIL: levi@levimclean.world
    volumes:
      - ${CONFIG}/vaultwarden-config:/data
    networks:
      - proxy

  #------------------------- MINECRAFT CONTAINERS -------------------#
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    container_name: crafty
    mem_limit: 6G
    environment:
      - TZ=${TZ}
    ports:
      - "8443:8443"
      - "25565:25565"
      - "25575:25575"
    volumes:
      - ${CONFIG}/crafty-config/config:/crafty/app/config
      - ${CONFIG}/crafty-config/backups:/crafty/backups
      - ${CONFIG}/crafty-config/logs:/crafty/logs
      - ${CONFIG}/crafty-config/servers:/crafty/servers
      - ${CONFIG}/crafty-config/import:/crafty/import
    restart: unless-stopped
#------------------------- VOLUMES & NETWORKS -------------------#
networks:
  proxy:
  db_network:
    driver: bridge
  portfolio_test:
    internal: true
